app:
  log_file: "bailiff.log"
  log_level: "INFO"
  data_dir: "data"

audio:
  sample_rate: 16000 # Sample rate for audio processing
  chunk_size: 512 # Size of audio chunks
  vad_threshold: 0.5 # Threshold for voice activity detection
  silence_limit: 1.0 # Limit for silence duration

models:
  llm_provider: "ollama" 
  llm_base_url: "http://localhost:11434/v1" # You can use any OpenAI compatible API
  llm_assistant: "llama3.2"
  llm_digestion: "llama3.2"
  llm_summary: "llama3.2"
  voice_embedding: "speechbrain/spkrec-ecapa-voxceleb"

diarization:
  threshold: 0.5 # Similarity threshold for speaker diarization
  inertia_weight: 0.1 # Weight added for previous speaker
  merge_timeout: 8.0 # Timeout for merging speaker segments
  segment_timeout: 3.0 # Timeout for speaker segments
  max_speakers: 16 # Cap on distinct speaker buckets

transcription:
  backend: "faster-whisper" # or "openai-http" to talk to Ollama / OpenAI / any /v1/audio/transcriptions endpoint
  model_size: "small" # faster-whisper alias, HF model id, or Ollama model name when backend is openai-http
  device: "cpu" # set "cuda" if you have a working GPU build (faster-whisper only)
  compute_type: "int8" # use "float16" with cuda (faster-whisper only)
  language: en # Set a language code (e.g. "pt", "en") or leave null for auto-detect (recommended for PT/EN code-switching)
  # openai-http only:
  # base_url: "http://localhost:11434/v1" # defaults to models.llm_base_url
  # api_key: # defaults to models.llm_api_key
  # model_by_language: # optional per-language override; only kicks in when `language` is set explicitly
  #   pt: "sendmeaiohyeah/whisper-large-v2"
  #   en: "sendmeaiohyeah/whisper-large-v2"
