[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bailiff"
version = "0.1.0"
description = "AI-powered meeting assistant with real-time transcription and diarization"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "torchaudio<2.9",
    "packaging",
    "faster-whisper",
    "textual",
    "sqlalchemy",
    "chromadb",
    "instructor",
    "openai",
    "httpx",
    "speechbrain",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "huggingface_hub",
    "silero-vad",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock",
]
platform-windows = ["pyaudiowpatch"]
platform-linux = ["sounddevice"]

[project.scripts]
bailiff = "bailiff.main:main"

[tool.setuptools.packages.find]
include = ["bailiff*"]
